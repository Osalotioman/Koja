name: Flutter APK Build

on:
  push:
    branches:
      - post-utme-version
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code from repository
      - uses: actions/checkout@v4

      # 2. Set up Java environment required by Android
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK environment
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Fetch dependencies
      - run: flutter pub get

      # 5. Generate temporary key.properties
      - name: Generate key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=dummyPassword
          keyPassword=dummyPassword
          keyAlias=dummyAlias
          storeFile=dummy.jks
          EOF

      # 6. Create a dummy keystore file so Gradle can resolve the path
      - name: Create dummy keystore
        run: touch android/dummy.jks

      # 7. Compile the APK
      - run: flutter build apk --debug

      # 8. Upload the finished APK file to GitHub so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-flutter-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
